# OpenProfiles needs to be reachable over https (Stremio only installs https add-ons).
# Put it behind a reverse proxy such as Caddy; see README.md.
services:
  openprofiles:
    image: ghcr.io/kgenovz/openprofiles:latest
    container_name: openprofiles
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://profiles.example.com   # the https address Stremio will use
      ACCESS: owner                              # the first Stremio account to sign in owns this server
      # LOG_LEVEL: info
    volumes:
      - openprofiles-data:/data                  # database + secret key: back this up
    ports:
      - "127.0.0.1:7000:7000"                    # only the reverse proxy should reach it

volumes:
  openprofiles-data:
